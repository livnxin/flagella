name: Build and Publish model container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'model/**'
      - 'service/prediction/Dockerfile'
      - '.github/workflows/model.yml'

env:
  IMAGE_NAME: livnxin/acephale

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            model/
          sparse-checkout-cone-mode: true

      - name: Write commit-scoped model tag 
        env:
            GITHUB_SHA: ${{ github.sha }}
        run: |
          cat > src/model/tag.py <<EOF
          modelkit_tag = "jozu.ml/livnxin/acephale:${GITHUB_SHA}"
          EOF
          cat src/model/tag.py

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run model
        env:
            JOZU_USERNAME: ${{ secrets.JOZU_USERNAME }}
            JOZU_PASSWORD: ${{ secrets.JOZU_PASSWORD }}
            JOZU_NAMESPACE: ${{ secrets.JOZU_NAMESPACE }}
        run: uv run model

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [publish]
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            chart/
          sparse-checkout-cone-mode: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update ModelKit tag
        run: |
          SHA="${{ github.sha }}"
          yq e '(.initContainers.env[] | select(.name == "MODELKIT_REF").value) = "jozu.ml/livnxin/acephale:" + strenv(SHA)' -i chart/prediction/values.yaml

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@livnxin.dev"

          git add chart/prediction
          git commit -m "${{ env.IMAGE_NAME }}: deploy tag ${{ github.sha }} "
          git push origin main