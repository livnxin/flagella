name: Build and Publish Prediction Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'service/prediction/**'
      - 'service/prediction/Dockerfile'
      - '.github/workflows/prediction.yml'

env:
  IMAGE_NAME: livnxin/flagella-prediction

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            service/prediction
          sparse-checkout-cone-mode: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          load: true
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [security]
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            service/prediction
          sparse-checkout-cone-mode: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image by digest
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [security, publish]
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            chart/
          sparse-checkout-cone-mode: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag
        run: |
          yq e '.image.tag = "${{ github.sha }}"' -i chart/prediction/values.yaml

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@livnxin.dev"

          git add chart/prediction
          git commit -m "${{ env.IMAGE_NAME }}: deploy tag ${{ github.sha }} "
          git push origin main