name: Build and Publish Prediction Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'service/prediction/**'
      - 'service/prediction/Dockerfile'
      - '.github/workflows/prediction.yml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: livnxin/flagella-prediction

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            service/prediction
          sparse-checkout-cone-mode: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          load: true
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

  publish:
    runs-on: ubuntu-latest
    needs: [security]
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            service/prediction
          sparse-checkout-cone-mode: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image by digest
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}