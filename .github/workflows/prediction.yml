name: Build and Publish Prediction Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'service/prediction/**'
      - 'service/prediction/Dockerfile'
      - '.github/workflows/prediction.yml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: livnxin/flagella-prediction

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            service/prediction
          sparse-checkout-cone-mode: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: service/prediction
          file: service/prediction/Dockerfile
          load: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
