apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "prediction.fullname" . }}
spec:
  parentRefs:
  - name: {{ include "prediction.fullname" . }}
  hostnames:
  - "flagella.livnxin.dev"
  rules:
    - matches:
        - path:
            type: Exact
            value: /prediction/openapi.json
      backendRefs:
        - name: {{ include "prediction.fullname" . }}
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /prediction
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "prediction.fullname" . }}
          port: 80