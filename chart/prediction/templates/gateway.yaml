apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "prediction.fullname" . }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
  - protocol: HTTP
    port: 80
    name: prod-web-gw
    allowedRoutes:
      namespaces:
        from: Same


apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "prediction.fullname" . }}
spec:
  parentRefs:
  - name: {{ include "prediction.fullname" . }}
  hostnames:
  - "flagella.livnxin.dev"
  rules:
  - backendRefs:
    - name: {{ include "prediction.fullname" . }}
      port: 80