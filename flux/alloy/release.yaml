apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 2m
  chart:
    spec:
      chart: grafana/alloy
      version: '1.13.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 2m
  values:
    alloy:
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
    controller:
      type: deployment
      replicas: 2