# infrastructure/gateway-api/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml


# infrastructure/gateway-api/flux-kustomization.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  path: ./flux/gateway/kustomization.yaml
  prune: false
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system