<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <main>
        <h1>House Price Prediction</h1>
        <form method="POST" action="/prediction" enctype="multipart/form-data">
            <label>Median Income
                <input type="number" step="0.0001" name="MedInc" value="8.3252" required>
            </label>

            <label>House Age
                <input type="number" step="0.01" name="HouseAge" value="41.0" required>
            </label>

            <label>Average Rooms
                <input type="number" step="0.0001" name="AveRooms" value="6.9841" required>
            </label>

            <label>Average Bedrooms
                <input type="number" step="0.0001" name="AveBedrms" value="1.0238" required>
            </label>

            <label>Population
                <input type="number" step="0.01" name="Population" value="322.0" required>
            </label>

            <label>Average Occupancy
                <input type="number" step="0.0001" name="AveOccup" value="2.5556" required>
            </label>

            <label>Latitude
                <input type="number" step="0.0001" name="Latitude" value="37.88" required>
            </label>

            <label>Longitude
                <input type="number" step="0.0001" name="Longitude" value="-122.23" required>
            </label>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <p>Predicted price: ${{ "%.0f"|format(prediction * 100000) }}</p>
        {% endif %}
    </main>
</body>
</html>
